      body {

        background-color: #f8fafc;

      .font-arabic {
        font-family: 'Noto Sans Arabic', sans-serif;
      }
      .gradient-mesh {
        background-color: #ffffff;
        background-image: 
          radial-gradient(at 0% 0%, hsla(170,100%,93%,1) 0, transparent 50%), 
          radial-gradient(at 50% 0%, hsla(190,100%,95%,1) 0, transparent 50%), 
          radial-gradient(at 100% 0%, hsla(210,100%,92%,1) 0, transparent 50%);
      }
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .shimmer-mask {
        mask-image: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,1) 50%, rgba(255,255,255,0) 100%);
        mask-size: 200% 100%;
        animation: shimmer 8s infinite linear;
      }
    </style>
